name: Feature request
description: Propose a user-facing improvement or a maintainer workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or maintenance problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the expected user-visible result and any safety constraints.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Does this affect real marketplace writes?
      options:
        - No, read-only or local-only
        - Possibly
        - Yes
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe existing workarounds or alternative approaches.
